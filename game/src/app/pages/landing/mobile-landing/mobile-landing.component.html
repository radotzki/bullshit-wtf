<div class="top-frame" [attr.dir]="t.dir" [attr.lang]="t.lang">
    <span class="title"> {{ t.title }} </span>
    <a class="lang-switch" *ngIf="t.lang === 'he'" [attr.lang]="t.switchTo" (click)="switchLanguage()">{{ t.switchLabel }}</a>
</div>
<section class="home" [attr.dir]="t.dir" [attr.lang]="t.lang" [class.is-rtl]="t.dir === 'rtl'">

    <div class="crews" *ngIf="crews.length">
        <a class="crew" *ngFor="let crew of crews" [routerLink]="['/c', crew.id]">
            <i class="fa fa-trophy"></i>
            <span class="crew-name" dir="auto">{{ crew.name }}</span>
            <span class="crew-action">{{ t.crewAction }}</span>
        </a>
    </div>

    <div class="menu-button join-game" routerLink="/join-game">
        <div class="menu-button-icon">
            <i class="fa fa-gamepad"></i>
        </div>
        <div class="menu-button-text">
            <p class="menu-button-text-main"> {{ t.join }} </p>
            <p class="menu-button-text-second"> {{ t.joinHint }} </p>
        </div>
    </div>

    <div class="menu-button create-game" routerLink="/create-game">
        <div class="menu-button-icon">
            <i class="fa fa-plus-square"></i>
        </div>
        <div class="menu-button-text">
            <p class="menu-button-text-main"> {{ t.create }} </p>
            <p class="menu-button-text-second"> {{ t.createHint }} </p>
        </div>
    </div>

    <div class="menu-button present-game" routerLink="/present-game">
        <div class="menu-button-icon">
            <i class="fa fa-share-square-o"></i>
        </div>
        <div class="menu-button-text">
            <p class="menu-button-text-main"> {{ t.present }} </p>
            <p class="menu-button-text-second"> {{ t.presentHint }} </p>
        </div>
    </div>

    <div class="menu-button how-to-play" routerLink="/learn">
        <div class="menu-button-icon">
            <i class="fa fa-graduation-cap"></i>
        </div>
        <div class="menu-button-text">
            <p class="menu-button-text-main"> {{ t.learn }} </p>
            <p class="menu-button-text-second"> {{ t.learnHint }} </p>
        </div>
    </div>
</section>
