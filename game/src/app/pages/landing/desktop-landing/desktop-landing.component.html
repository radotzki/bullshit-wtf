<div class="arcade-form create-game" [attr.dir]="t.dir" [attr.lang]="t.lang">
    <div class="title-area">
        <h1 class="title">{{ t.name }}</h1>
        <h3 class="sub-title">{{ t.subTitle }}</h3>
        <div class="separator">♦</div>
        <a class="lang-switch" *ngIf="t.lang === 'he'" [attr.lang]="t.switchTo" (click)="switchLanguage()">{{ t.switchLabel }}</a>
    </div>

    <div class="columns main-columns">
        <div class="column is-half">

            <div class="columns">
                <div class="column">
                    <div class="menu-button" routerLink="/join-game">
                        <i class="fa fa-gamepad"></i>
                        <p>{{ t.joinShort }}</p>
                    </div>
                </div>

                <div class="column">
                    <div class="menu-button" routerLink="/create-game">
                        <i class="fa fa-plus-square"></i>
                        <p>{{ t.createShort }}</p>
                    </div>
                </div>
            </div>

            <div class="columns">
                <div class="column">
                    <div class="menu-button" routerLink="/present-game">
                        <i class="fa fa-share-square-o"></i>
                        <p>{{ t.presentShort }}</p>
                    </div>
                </div>

                <div class="column">
                    <div class="menu-button" routerLink="/learn">
                        <i class="fa fa-graduation-cap"></i>
                        <p>{{ t.learnShort }}</p>
                    </div>
                </div>
            </div>

            <div class="your-crews" *ngIf="crews.length">
                <p class="your-crews-title">{{ t.yourCrews }}</p>
                <a class="button is-info is-fullwidth" *ngFor="let crew of crews" [routerLink]="['/c', crew.id]">
                    <span class="icon"><i class="fa fa-trophy"></i></span>
                    <span><span dir="auto">{{ crew.name }}</span>: {{ t.crewActionShort }}</span>
                </a>
            </div>

        </div>
    </div>

</div>
