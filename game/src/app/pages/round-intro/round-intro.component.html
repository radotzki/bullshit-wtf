<section class="game-container round-intro" [attr.dir]="t.rtl ? 'rtl' : null" [attr.lang]="t.rtl ? 'he' : null">
    <app-game-header></app-game-header>

    <div class="game-main">
        <div class="screen-center">
            <p class="bullshit">
                {{t.points(points.bullshit)}}
                <br>
                {{t.forEveryoneYouBullshit}}
            </p>
            <p class="truth">
                {{t.points(points.truth)}}
                <br>
                {{t.forFindingTheTruth}}
            </p>
        </div>
    </div>

    <app-game-footer *ngIf="!presenter"></app-game-footer>
</section>
