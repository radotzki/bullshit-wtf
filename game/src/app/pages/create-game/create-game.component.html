<div class="arcade-form create-game" [attr.dir]="t.dir === 'rtl' ? 'rtl' : null" [attr.lang]="t.dir === 'rtl' ? t.lang : null"
    [class.is-rtl]="t.dir === 'rtl'">
    <form (submit)="submit()" novalidate>

        <div class="title-area">
            <h1 class="title" routerLink="/">{{ t.title }}</h1>
            <h3 class="sub-title">{{ t.heading }}</h3>
            <div class="separator">♦</div>
        </div>

        <div class="create-game-controls-wrapper">
            <div class="controls">
                <label>{{ t.language }}</label>
                <p class="control">
                    <label class="radio vertical">
                        <input type="radio" name="locale" [value]="'en'" [(ngModel)]="locale"> {{ t.english }}
                    </label>
                    <label class="radio vertical">
                        <input type="radio" name="locale" [value]="'he'" [(ngModel)]="locale"> {{ t.hebrew }}
                    </label>
                </p>

                <label>{{ t.length }}</label>
                <p class="control">
                    <label class="radio vertical">
                        <input type="radio" name="length" [value]="5" [(ngModel)]="length"> 5 {{ t.questions }}
                    </label>
                    <label class="radio vertical">
                        <input type="radio" name="length" [value]="7" [(ngModel)]="length"> 7 {{ t.questions }}
                    </label>
                    <label class="radio vertical">
                        <input type="radio" name="length" [value]="9" [(ngModel)]="length"> 9 {{ t.questions }}
                    </label>
                </p>

                <ng-container *ngIf="pack">
                    <label>{{ t.special }}</label>
                    <p class="control">
                        <label class="checkbox vertical pack-option">
                            <input type="checkbox" name="usePack" [(ngModel)]="usePack"> {{ packIcon }} {{ packLabel }}
                        </label>
                    </p>
                </ng-container>

                <div class="notification is-danger" *ngIf="errorMsg"> {{errorMsg}} </div>
            </div>

            <p class="control action">
                <button class="button is-primary is-medium is-fullwidth" type="submit" [class.is-loading]="loading">{{ t.create }}</button>
            </p>
        </div>
    </form>
</div>
