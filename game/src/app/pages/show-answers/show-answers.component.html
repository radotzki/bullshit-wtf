<section class="game-container show-answers" [attr.dir]="t.rtl ? 'rtl' : null" [attr.lang]="t.rtl ? 'he' : null">
    <app-game-header></app-game-header>
    <progress *ngIf="answers && past && duration" class="progress" [class.is-primary]="!panic" [class.is-danger]="panic"
        [value]="past" [max]="duration"></progress>

    <div class="game-main">
        <div *ngIf="!answers" class="screen-center">
            <div class="loader"> </div>
        </div>

        <div *ngIf="answers && presenter" class="presenter">
            <p class="question" [class.rtl]="rtl"> {{question | bsQuestion}} </p>

            <div class="columns is-multiline">
                <p *ngFor="let answer of answers" class="column is-one-third-tablet is-one-third-desktop">
                    <button class="button is-primary is-fullwidth answer" [class.rtl]="rtl">
                        {{ answer | uppercase }}
                    </button>
                </p>
            </div>

            <app-waiting-row [pin]="pin" [t]="t" [presenter]="true" [compact]="true"></app-waiting-row>
        </div>

        <!-- An About question about this player: they know the truth, so they see the list and pick nothing. -->
        <div *ngIf="answers && aboutMe && !presenter" class="about-watch">
            <p class="about-watch-title" [class.rtl]="rtl">{{ aboutWords.youWatch }}</p>
            <p *ngFor="let answer of answers" class="control">
                <span class="button is-static is-fullwidth answer" [class.rtl]="rtl">{{ answer | uppercase }}</span>
            </p>
            <app-waiting-row [pin]="pin" [t]="t" [compact]="true"></app-waiting-row>
        </div>

        <div *ngIf="answers && !answerSelected && !presenter && !aboutMe">
            <p *ngIf="taste" class="taste-question" [class.rtl]="rtl"> {{question | bsQuestion}} </p>

            <p *ngFor="let answer of answers" class="control">
                <button class="button is-primary is-fullwidth answer" (click)="submit(answer)" [disabled]="loading" [class.rtl]="rtl">
                    {{ answer | uppercase }}
                </button>
            </p>

            <p class="control">
                <button *ngIf="!showQuestion && !taste" class="button is-info is-fullwidth" (click)="showQuestion = true">{{t.whatWasTheQuestion}}</button>
            </p>

            <p *ngIf="showQuestion" [class.rtl]="rtl"> {{question | bsQuestion}} </p>
        </div>

        <div *ngIf="answerSelected" class="screen-center">
            <app-waiting-row [pin]="pin" [t]="t" [line]="t.waitForFriends"></app-waiting-row>
        </div>

        <div class="notification is-danger" *ngIf="errorMsg"> {{errorMsg}} </div>
    </div>

    <app-game-footer *ngIf="!presenter"></app-game-footer>
</section>
