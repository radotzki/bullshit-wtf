<div class="arcade-form">
    <form (submit)="submit()" novalidate>

        <div class="title-area">
            <h1 class="title" routerLink="/">Bullshit</h1>
            <h3 *ngIf="!nicknameState && !gameOver" class="sub-title">Enter a game PIN</h3>
            <h3 *ngIf="nicknameState && !crewName && !gameOver" class="sub-title">Enter a nickname</h3>
            <h3 *ngIf="nicknameState && crewName && !gameOver" class="sub-title" dir="auto">{{ crewName }} rematch: who are you?</h3>
            <div class="separator">♦</div>
        </div>

        <div class="controls-wrapper" *ngIf="gameOver">
            <div class="controls game-over">
                <p class="game-over-title">Game over</p>
                <p class="game-over-text">Game {{ gameOver.pin }} has finished. Check the PIN and try again.</p>
                <p class="game-over-text" *ngIf="gameOver.rematch">Its players started a new game: {{ gameOver.rematch }}.</p>
                <p class="game-over-text" *ngIf="gameOver.justEnded">If they play again, ask for the new PIN.</p>
                <div class="field" *ngIf="gameOver.rematch">
                    <button class="button is-primary is-medium is-fullwidth join-rematch" type="button"
                        (click)="joinRematch()">JOIN {{ gameOver.rematch }}</button>
                </div>
                <div class="field">
                    <button class="button is-medium is-fullwidth try-again" type="button"
                        [class.is-primary]="!gameOver.rematch" (click)="tryAnotherPin()">TRY ANOTHER PIN</button>
                </div>
                <!-- A late joiner has no game: ask them to start one. -->
                <app-host-ask [locale]="askLocale" place="game-over"></app-host-ask>
            </div>
        </div>

        <div class="controls-wrapper" *ngIf="!gameOver">
            <div class="controls">
                <div class="field" *ngIf="!nicknameState">
                    <p class="control">
                        <input class="input is-large pin-input" type="text" placeholder="Game PIN" [(ngModel)]="pin"
                            name="pin" appAutofocus>
                    </p>
                </div>

                <div class="field" *ngIf="nicknameState">
                    <p class="control">
                        <input class="input is-large pin-input" type="text" placeholder="Nickname"
                            [(ngModel)]="nickname" name="nickname" appAutofocus maxlength="9">
                    </p>
                </div>

                <div class="field crew-nicknames" *ngIf="nicknameState && crewNicknames.length">
                    <button *ngFor="let n of crewNicknames" type="button" class="button is-small is-rounded"
                        [class.is-primary]="nickname === n" (click)="pickNickname(n)" dir="auto">{{ n }}</button>
                </div>

                <div class="notification is-danger" *ngIf="errorMsg"> {{errorMsg}} </div>

                <div class="field" *ngIf="!nicknameState">
                    <button class="button is-primary is-medium is-fullwidth" type="submit" [disabled]="!pin"
                        [class.is-loading]="loading">NEXT</button>
                </div>
                <div class="field" *ngIf="nicknameState">
                    <button class="button is-primary is-medium is-fullwidth" type="submit" [disabled]="!nickname"
                        [class.is-loading]="loading">JOIN</button>
                </div>
            </div>
        </div>
    </form>
</div>
