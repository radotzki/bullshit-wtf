<div class="arcade-form">
    <form (submit)="submit()" novalidate>

        <div class="title-area">
            <h1 class="title" routerLink="/">Bullshit</h1>
            <h3 *ngIf="!nicknameState" class="sub-title">Enter a game PIN</h3>
            <h3 *ngIf="nicknameState && !crewName" class="sub-title">Enter a nickname</h3>
            <h3 *ngIf="nicknameState && crewName" class="sub-title" dir="auto">{{ crewName }} rematch: who are you?</h3>
            <div class="separator">♦</div>
        </div>

        <div class="controls-wrapper">
            <div class="controls">
                <div class="field" *ngIf="!nicknameState">
                    <p class="control">
                        <input class="input is-large pin-input" type="text" placeholder="Game PIN" [(ngModel)]="pin"
                            name="pin" appAutofocus>
                    </p>
                </div>

                <div class="field" *ngIf="nicknameState">
                    <p class="control">
                        <input class="input is-large pin-input" type="text" placeholder="Nickname"
                            [(ngModel)]="nickname" name="nickname" appAutofocus maxlength="9">
                    </p>
                </div>

                <div class="field crew-nicknames" *ngIf="nicknameState && crewNicknames.length">
                    <button *ngFor="let n of crewNicknames" type="button" class="button is-small is-rounded"
                        [class.is-primary]="nickname === n" (click)="pickNickname(n)" dir="auto">{{ n }}</button>
                </div>

                <div class="notification is-danger" *ngIf="errorMsg"> {{errorMsg}} </div>

                <div class="field" *ngIf="!nicknameState">
                    <button class="button is-primary is-medium is-fullwidth" type="submit" [disabled]="!pin"
                        [class.is-loading]="loading">NEXT</button>
                </div>
                <div class="field" *ngIf="nicknameState">
                    <button class="button is-primary is-medium is-fullwidth" type="submit" [disabled]="!nickname"
                        [class.is-loading]="loading">JOIN</button>
                </div>
            </div>
        </div>
    </form>
</div>
