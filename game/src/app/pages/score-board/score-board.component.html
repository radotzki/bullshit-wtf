<section class="game-container score-board" [appFitScreen]="presenter" [class.many]="displayPlayers && displayPlayers.length > 8" [attr.dir]="rtl ? 'rtl' : null">
    <app-game-header></app-game-header>
    <!-- A solo run: lives, truths found, the streak (nothing in any other game). -->
    <app-run-bar *ngIf="!presenter" [pin]="pin"></app-run-bar>

    <div class="game-main">
        <div *ngIf="!displayPlayers" class="screen-center">
            <div class="loader"> </div>
        </div>

        <div *ngIf="displayPlayers">
            <div class="box player" *ngFor="let player of displayPlayers">
                <span class="left">
                    <img class="picture" [src]="'/assets/' + player.picture">
                    <span class="name"> {{ player.nickname }} </span>
                </span>
                <span class="score"> {{ player.score }} </span>
            </div>
        </div>
    </div>

    <app-game-footer *ngIf="!presenter"></app-game-footer>
</section>
