<div class="host-ask" [class.late]="late" [class.is-rtl]="rtl" [attr.dir]="rtl ? 'rtl' : 'ltr'" [attr.lang]="rtl ? 'he' : 'en'">
    <p class="ask-title">{{ late ? t.lateTitle : t.title }}</p>
    <p class="ask-text">{{ late ? t.lateText : t.text }}</p>
    <div class="ask-buttons">
        <button class="button is-primary ask-create" type="button" (click)="create()">{{ t.create }}</button>
        <button class="button ask-remind" type="button" (click)="remind()">{{ t.remind }}</button>
    </div>
    <p class="ask-saved" *ngIf="reminded">
        {{ t.saved }}
        <a class="ask-google" [href]="googleUrl" target="_blank" rel="noopener" (click)="google()">{{ t.google }}</a>
    </p>
</div>
