<div class="waiting-row" [class.on-big-screen]="presenter" [class.in-top-bar]="compact" [attr.dir]="t.rtl ? 'rtl' : null">
    <p *ngIf="view.line" class="waiting-line">{{ view.line }}</p>

    <ul *ngIf="view.seats.length" class="seats">
        <li *ngFor="let seat of view.seats; trackBy: seatId" class="seat" [ngClass]="'is-' + seat.mark"
            [attr.aria-label]="seat.label || null">
            <span class="picture-box">
                <img class="picture" [src]="'/assets/' + seat.picture" alt="">
                <span *ngIf="seat.mark === 'done'" class="mark" aria-hidden="true">&#10003;</span>
                <span *ngIf="seat.mark === 'waiting'" class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
            </span>
            <span class="name" aria-hidden="true">{{ seat.nickname }}</span>
        </li>
    </ul>
</div>
