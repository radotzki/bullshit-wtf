<div class="game-header" [style.visibility]="loading ? 'hidden' : 'visible'" [class.presenter]="presenter" [attr.dir]="t.rtl ? 'rtl' : null">
    <div class="game-header-left">
        <a class="button is-primary is-outlined" (click)="homeModal()">
            <span class="icon" [class.is-medium]="presenter">
                <i class="fa fa-home"></i>
            </span>
        </a>

        <span *ngIf="!gameOver && !(registration && presenter)" class="pin"> {{t.pin(pinUpper)}} </span>
    </div>

    <button *ngIf="button" (click)="onClick.next()" class="button is-primary" [class.is-loading]="buttonLoading"> {{button}} </button>

    <span *ngIf="text" class="text"> {{text | uppercase}} </span>

    <span *ngIf="registration && presenter" class="registration">
        {{t.joinAt}}
        <span class="url"> bullshit.wtf </span>
        {{t.withPin}}
        <span class="game-pin"> {{pin | uppercase}} </span>
    </span>
</div>

<div class="modal leave-modal" [class.is-active]="showGoHomeModal" [attr.dir]="t.rtl ? 'rtl' : null">
    <div class="modal-background"></div>
    <div class="modal-content">
        <section class="modal-card-body">
            <h3 class="title">{{t.leaveTitle}}</h3>
            <p>{{t.leaveText}}</p>
        </section>

        <footer class="modal-card-foot">
            <button class="button is-primary" (click)="showGoHomeModal=false">{{t.keepPlaying}}</button>
            <button class="button" (click)="navigateHome()">{{t.backHome}}</button>
        </footer>

    </div>
</div>
