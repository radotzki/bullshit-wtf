<!-- Presenter (TV / laptop): always-visible scan-to-join card -->
<div *ngIf="presenter && ready" class="invite-presenter box" [attr.dir]="g.rtl ? 'rtl' : null">
    <app-qr-code class="qr" [data]="qrUrl" [label]="g.scanLabel(pinUpper)"></app-qr-code>
    <p class="scan"> {{g.scanToJoin}} </p>
    <p class="url"> {{displayUrl}} </p>
</div>

<!-- Phone, host alone in the lobby: the invite is the screen. WhatsApp first, then share or copy, then the QR. -->
<div *ngIf="!presenter && inline && ready" class="invite-inline" [attr.dir]="g.rtl ? 'rtl' : null">
    <a class="button is-success is-fullwidth is-medium whatsapp" [href]="whatsappUrl" target="_blank" rel="noopener" (click)="whatsapp()">
        <span class="icon"><i class="fa fa-whatsapp"></i></span>
        <span> {{g.whatsapp}} </span>
    </a>
    <button *ngIf="canShare" class="button is-primary is-fullwidth" (click)="share()">
        <span class="icon"><i class="fa fa-share-alt"></i></span>
        <span> {{g.shareLink}} </span>
    </button>
    <button *ngIf="!canShare" class="button is-fullwidth" (click)="copy()">
        <span class="icon"><i class="fa" [class.fa-link]="!copied" [class.fa-check]="copied"></i></span>
        <span> {{copied ? g.linkCopied : g.copyLink}} </span>
    </button>

    <p class="scan-hint" [attr.dir]="locale === 'he' ? 'rtl' : null"> {{t?.scanHint}} </p>
    <app-qr-code class="qr" [data]="qrUrl" [label]="g.scanLabel(pinUpper)"></app-qr-code>
    <p class="pin"> {{g.pin(pinUpper)}} </p>
</div>

<!-- Phone: invite button + sheet -->
<div *ngIf="!presenter && !inline && ready" class="invite-phone" [attr.dir]="g.rtl ? 'rtl' : null">
    <button class="button is-primary is-outlined is-fullwidth invite-button" (click)="toggle()">
        <span class="icon"><i class="fa fa-user-plus"></i></span>
        <span> {{g.inviteFriends}} </span>
    </button>

    <div class="modal" [class.is-active]="open">
        <div class="modal-background" (click)="toggle()"></div>
        <div class="modal-content">
            <section class="modal-card-body invite-sheet">
                <h3 class="title"> {{g.inviteFriends}} </h3>
                <p class="hint"> {{g.inviteHint}} </p>

                <app-qr-code class="qr" [data]="qrUrl" [label]="g.scanLabel(pinUpper)"></app-qr-code>
                <p class="pin"> {{g.pin(pinUpper)}} </p>

                <button *ngIf="canShare" class="button is-primary is-fullwidth" (click)="share()">
                    <span class="icon"><i class="fa fa-share-alt"></i></span>
                    <span> {{g.shareLink}} </span>
                </button>
                <a class="button is-success is-fullwidth whatsapp" [href]="whatsappUrl" target="_blank" rel="noopener" (click)="whatsapp()">
                    <span class="icon"><i class="fa fa-whatsapp"></i></span>
                    <span> {{g.whatsapp}} </span>
                </a>
                <button class="button is-fullwidth" (click)="copy()">
                    <span class="icon"><i class="fa" [class.fa-link]="!copied" [class.fa-check]="copied"></i></span>
                    <span> {{copied ? g.linkCopied : g.copyLink}} </span>
                </button>
            </section>
            <footer class="modal-card-foot">
                <button class="button is-primary" (click)="toggle()"> {{g.done}} </button>
            </footer>
        </div>
    </div>
</div>
