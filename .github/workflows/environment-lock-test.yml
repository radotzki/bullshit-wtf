# One-time test, removed by the next commit on this branch. It deploys nothing and names no secret.
# Question: does GitHub let a branch other than master use the "production" environment?
# Refused before the job starts: the master-only rule is set. The job runs: the rule is missing.
name: Environment lock test

on:
  push:
    branches: ['qa/environment-lock-test']
    paths: ['.github/workflows/environment-lock-test.yml']

permissions: {}

jobs:
  probe:
    name: Probe the production environment (no secret, no deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: production
    steps:
      - run: echo "This job started on $GITHUB_REF, so the production environment accepted this branch."
