# The night-after check for every pull request: .github/smoke/emulator-night-after.js plays a whole
# test game on three phones and the big screen, in English and in Hebrew, against the Firebase
# emulators, then opens the game's link again as a player, as someone who didn't play and in the
# control half. It is the one test of the join page's recap and the final scoreboard together.
#
# Needs no secrets and touches no Firebase project: the emulators run under the demo-bullshit
# project, the browser resolves no host but 127.0.0.1, and every request the built game makes to
# Firebase is sent to the emulators (see emulator-game.js).
#
# It lives apart from ci.yml on purpose: deploy.yml calls ci.yml before a release, and this run
# is a pull request check only, so it adds nothing to a release.
name: Night after

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: night-after-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  night-after:
    name: Night after (emulators, English and Hebrew)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          # 22, the functions' Cloud runtime: the functions emulator runs them on this Node.
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            game/package-lock.json
            functions/package-lock.json
            .github/smoke/package-lock.json
      # The database emulator is a Java program.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install firebase-tools (the root's lockfile)
        run: npm ci --no-audit --no-fund
      - name: Build the functions
        working-directory: functions
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Build the game
        working-directory: game
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Install the smoke test
        working-directory: .github/smoke
        run: npm ci --no-audit --no-fund

      - name: Cache the browser and the emulators
        id: tool-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/firebase/emulators
          key: night-after-${{ runner.os }}-${{ hashFiles('.github/smoke/package-lock.json', 'package-lock.json') }}
      - name: Download the browser
        if: steps.tool-cache.outputs.cache-hit != 'true'
        working-directory: .github/smoke
        run: npx playwright install --only-shell chromium

      - name: Run the night-after check
        timeout-minutes: 20
        env:
          SHOTS: ${{ runner.temp }}/night-after-shots
        run: node .github/smoke/emulator-night-after.js game/dist

      # On a failure: the screenshots of the run and the emulators' log, to see what the page showed.
      - name: Keep the screenshots and the emulators' log
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/night-after-shots"
          for f in /tmp/bs-emulators-*/emulators.log; do
            [ -f "$f" ] && cp "$f" "$RUNNER_TEMP/night-after-shots/$(basename "$(dirname "$f")").log"
          done
          true
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: night-after-failure
          path: ${{ runner.temp }}/night-after-shots
          retention-days: 7
          if-no-files-found: ignore
