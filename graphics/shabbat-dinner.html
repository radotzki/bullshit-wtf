<link href="https://fonts.googleapis.com/css?family=Luckiest+Guy|Suez+One" rel="stylesheet">
<style>

p{margin:12px 0 0;font-size:38px;line-height:1.2;color:#fff}
.he{direction:rtl;font-family:"Suez One",sans-serif}
.he .art{margin:0 70px 90px 40px}
.he .text{padding-right:0;padding-left:60px}
.he .kicker{font-size:58px}

.white{background:#fff}
.white h1{-webkit-text-stroke:5px #9b9b9b;text-shadow:6px 8px 0 rgba(0,0,0,.18)}
.white .kicker{color:#97374e}

.confetti{background:
 radial-gradient(circle at 8% 14%,#f3d467 0 7px,transparent 8px),radial-gradient(circle at 22% 82%,#db7151 0 6px,transparent 7px),

 radial-gradient(circle at 55% 78%,#f3d467 0 5px,transparent 6px),radial-gradient(circle at 4% 52%,#7fd1c7 0 5px,transparent 6px)}
