<!doctype html><html><head><meta charset="utf-8">
<!-- Link preview (1200x630) for the English Hanukkah activity for youth groups, /hanukkah-youth-group-activity
     (game/seo/pages-en-hanukkah-activity.js). The same card as the Hebrew activity page's (graphics/hanukkah-activity.html,
     pull request #239), in English: the menorah of hanukkah.html on the night sky. No real faces, no other company's artwork.

<link href="https://fonts.googleapis.com/css?family=Luckiest+Guy|Suez+One" rel="stylesheet">
<style>
html,body{margin:0;background:#888}

.dots{position:absolute;inset:0}
.band{position:absolute;left:0;right:0;bottom:0;height:96px;background:#db7151;color:#fff;display:flex;align-items:center;justify-content:center;font-size:40px;letter-spacing:1px;text-align:center}
.art{direction:ltr;width:340px;height:340px;margin:0 40px 90px 70px;display:block;flex:none;position:relative}
.text{flex:1;padding-right:60px;margin-bottom:90px;position:relative}
h1{margin:0;font-size:124px;line-height:1;color:#fff;-webkit-text-stroke:5px #f3d467;text-shadow:6px 8px 0 rgba(0,0,0,.3);font-weight:normal}
.kicker{margin:16px 0 0;font-size:56px;line-height:1.1;color:#f3d467}
p{margin:12px 0 0;font-size:38px;line-height:1.2;color:#fff}
.he{direction:rtl;font-family:"Suez One",sans-serif}
.he .art{margin:0 70px 90px 40px}
.he .text{padding-right:0;padding-left:60px}
.he .kicker{font-size:58px}
/* Brand white, as the search pages' own previews */
.white{background:#fff}
.white h1{-webkit-text-stroke:5px #9b9b9b;text-shadow:6px 8px 0 rgba(0,0,0,.18)}
.white .kicker{color:#97374e}
.white p{color:#4a4a4a}
/* Colours per occasion */
.wine{background:#97374e}
.night{background:#13284f}
.green{background:#1f5b3e}
.plum{background:#3b1f5c}
.teal{background:#1d5560}
.stars{background:
 radial-gradient(circle at 10% 16%,rgba(243,212,103,.4) 0 3px,transparent 4px),
 radial-gradient(circle at 84% 12%,rgba(243,212,103,.35) 0 2px,transparent 3px),
 radial-gradient(circle at 66% 32%,rgba(255,255,255,.25) 0 2px,transparent 3px),
 radial-gradient(circle at 26% 62%,rgba(255,255,255,.2) 0 2px,transparent 3px),
 radial-gradient(circle at 93% 66%,rgba(243,212,103,.35) 0 3px,transparent 4px),
 radial-gradient(circle at 47% 8%,rgba(255,255,255,.25) 0 2px,transparent 3px)}
.snow{background:
 radial-gradient(circle at 6% 10%,#fff 0 5px,transparent 6px),radial-gradient(circle at 18% 70%,rgba(255,255,255,.8) 0 4px,transparent 5px),

 radial-gradient(circle at 97% 78%,#fff 0 3px,transparent 4px),radial-gradient(circle at 46% 40%,rgba(255,255,255,.6) 0 3px,transparent 4px)}
.confetti{background:
 radial-gradient(circle at 8% 14%,#f3d467 0 7px,transparent 8px),radial-gradient(circle at 22% 82%,#db7151 0 6px,transparent 7px),
 radial-gradient(circle at 41% 9%,#7fd1c7 0 6px,transparent 7px),radial-gradient(circle at 63% 18%,#f3d467 0 5px,transparent 6px),
 radial-gradient(circle at 88% 10%,#db7151 0 7px,transparent 8px),radial-gradient(circle at 95% 55%,#7fd1c7 0 6px,transparent 7px),
 radial-gradient(circle at 55% 78%,#f3d467 0 5px,transparent 6px),radial-gradient(circle at 4% 52%,#7fd1c7 0 5px,transparent 6px)}
.sky{background:#2a6f97}
.sun{background:#c8553d}
.art.menorah{width:360px;height:auto}

<div class="card night" id="hanukkah-activity-en"><div class="dots stars"></div><span data-art="menorah-art"></span>
  <div class="text"><h1>BULLSHIT</h1><div class="kicker">A ready Hanukkah activity</div><p>45 minutes for youth groups, grades 7 to 12. Print it.</p></div>
  <div class="band" style="font-size:34px">FREE · IN THE BROWSER · UP TO 12 PHONES A GAME · BULLSHIT.WTF</div></div>

<script>
// Hebrew cards: right to left. Each [data-art] takes its picture.
document.querySelectorAll('.card').forEach(function (c) { if (/-he$/.test(c.id)) c.classList.add('he'); });
document.querySelectorAll('[data-art]').forEach(function (el) {
  el.replaceWith(document.getElementById(el.getAttribute('data-art')).content.cloneNode(true));
});
</script>
</body></html>
